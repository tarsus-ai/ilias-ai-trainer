# Runs the test suite (tests/README.md) on every pull request and on pushes
# to main. The suite needs no ILIAS: a fake ILIAS, an in-memory SQLite
# database and a local stand-in for the Tarsus API are part of it.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, pdo_sqlite, mbstring, json
          coverage: none

      - name: PHP syntax
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n 1 php -l > /dev/null

      - name: JavaScript syntax
        run: node --check templates/js/tarsus.js

      - name: Test suite
        run: php tests/run.php
