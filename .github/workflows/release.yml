# Publishes a GitHub release for every version in CHANGELOG.md that has no
# tag yet: bump `$version` in plugin.php, add the changelog section, push to
# main – and the tag, the plugin zip and the release appear.
name: Release

on:
  push:
    branches: [main]
    paths:
      - plugin.php
      - CHANGELOG.md
      - .github/workflows/release.yml
      - .github/scripts/release.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag, build and publish missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh
